name: Release

on:
  # Use the base branch context for the protected release environment.
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 2.18.0)
        required: true
        type: string
      target_commit:
        description: Full commit SHA on main to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.repository == 'privy-io/privy-ios' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.pull_request.merged == true &&
          startsWith(github.event.pull_request.title, 'chore: release ')
        )
      )
    runs-on: ubuntu-latest
    environment: package-release
    steps:
      - name: Validate release inputs
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target_commit || github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION="${VERSION:-${PR_TITLE#chore: release }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TARGET" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release target must be a full commit SHA" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$RELEASE_TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.version.outputs.target }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release target is on main
        env:
          RELEASE_TARGET: ${{ steps.version.outputs.target }}
        run: git merge-base --is-ancestor "$RELEASE_TARGET" origin/main

      - name: Mint Builder Blobby token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUILDER_BLOBBY_APP_ID }}
          private-key: ${{ secrets.BUILDER_BLOBBY_APP_PRIVATE_KEY }}
          owner: privy-io
          repositories: privy-ios
          permission-contents: write

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TARGET: ${{ steps.version.outputs.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ANCHOR="${VERSION//./-}"

          gh release create "$VERSION" \
            --target "$RELEASE_TARGET" \
            --title "$VERSION" \
            --notes "See the [Privy iOS SDK $VERSION changelog](https://docs.privy.io/basics/swift/changelog#$ANCHOR) for release details."
