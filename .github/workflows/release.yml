name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.repository == 'privy-io/privy-ios' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore: release ')
    runs-on: ubuntu-latest
    environment: package-release
    steps:
      - name: Extract version from PR title
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          VERSION="${PR_TITLE#chore: release }"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Mint Builder Blobby token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUILDER_BLOBBY_APP_ID }}
          private-key: ${{ secrets.BUILDER_BLOBBY_APP_PRIVATE_KEY }}
          owner: privy-io
          repositories: privy-ios
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ANCHOR="${VERSION//./-}"

          gh release create "$VERSION" \
            --target "$RELEASE_TARGET" \
            --title "$VERSION" \
            --notes "See the [Privy iOS SDK $VERSION changelog](https://docs.privy.io/basics/swift/changelog#$ANCHOR) for release details."
